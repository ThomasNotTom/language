name: CI

on:
  push:
    branches:
      - "**"
      - "!main"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcatch2-dev

          sudo apt-get install -y llvm-dev libllvm-s-dev || sudo apt-get install -y llvm-dev

      - name: Build and Test
        run: |
          cmake .
          ./build/bin/tests
